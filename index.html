<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b3d2e">
<title>Hisaab — Bunty Kirana Store</title>
<style>
  :root{
    --bg:#f6f1e7; --card:#ffffff; --ink:#1d2b24; --muted:#6b7a72; --line:#e4ddd0;
    --accent:#0b6b3a; --accent-ink:#ffffff; --credit:#b3391f; --credit-bg:#fdeae4;
    --pay:#0b6b3a; --pay-bg:#e2f3e8; --gold:#b07d10; --shadow:0 2px 10px rgba(30,40,30,.08);
    --danger:#b3261e; --wa:#1faa53;
  }
  html[data-theme="dark"]{
    --bg:#121714; --card:#1c2420; --ink:#e8efe9; --muted:#9aab9f; --line:#2c3831;
    --accent:#37b26f; --accent-ink:#06130b; --credit:#ff9b7f; --credit-bg:#33201a;
    --pay:#5fd694; --pay-bg:#15291d; --gold:#e0b34f; --shadow:0 2px 12px rgba(0,0,0,.45);
    --danger:#ff6f61; --wa:#2ecb64;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Devanagari","Noto Sans Telugu",system-ui,sans-serif;
    font-size:15px; line-height:1.45;
  }
  #app{max-width:420px;margin:0 auto;min-height:100vh;padding-bottom:96px;position:relative}
  button{font:inherit}
  input,select,textarea{font:inherit;color:var(--ink)}
  .hidden{display:none!important}

  /* ---------- Header ---------- */
  header{
    position:sticky;top:0;z-index:30;
    background:linear-gradient(135deg,#0b3d2e,#0b6b3a 70%,#0f7a44);
    color:#fff;padding:12px 14px 14px;border-radius:0 0 18px 18px;
    box-shadow:0 2px 12px rgba(0,0,0,.25);
  }
  .hrow{display:flex;align-items:center;gap:8px}
  .hrow .spacer{flex:1}
  .iconbtn{
    min-width:40px;min-height:40px;border:none;border-radius:12px;cursor:pointer;
    background:rgba(255,255,255,.14);color:#fff;font-size:17px;display:inline-flex;align-items:center;justify-content:center;padding:0 10px;
  }
  .iconbtn:active{transform:scale(.94)}
  .brand{margin-top:6px;display:flex;align-items:center;gap:10px}
  .logo{
    width:40px;height:40px;border-radius:12px;background:#fff;color:#0b6b3a;
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;flex:none;
  }
  .brand h1{margin:0;font-size:20px;letter-spacing:.3px}
  .brand .shop{font-size:12.5px;opacity:.92;margin-top:1px}
  .today-chip{margin-top:8px;font-size:12px;opacity:.9;display:flex;gap:6px;align-items:center}
  select.langsel{
    background:rgba(255,255,255,.14);color:#fff;border:none;border-radius:10px;padding:7px 8px;font-size:13px;min-height:38px;
  }
  select.langsel option{color:#111}

  /* ---------- Total card ---------- */
  .total-card{
    margin:12px 14px 4px;background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:14px 16px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;
  }
  .total-card .tlabel{font-size:12.5px;color:var(--muted);font-weight:600;letter-spacing:.3px}
  .total-card .tval{font-size:26px;font-weight:800;color:var(--accent);margin-top:2px}
  .total-card .ticon{
    width:44px;height:44px;border-radius:12px;background:var(--pay-bg);color:var(--pay);
    display:flex;align-items:center;justify-content:center;font-size:20px;flex:none;
  }

  /* ---------- Search + tabs ---------- */
  .searchwrap{padding:12px 14px 0}
  .searchwrap input{
    width:100%;min-height:44px;border:1px solid var(--line);border-radius:12px;background:var(--card);
    padding:10px 12px 10px 38px;outline:none;
  }
  .searchwrap{position:relative}
  .searchwrap .sicon{position:absolute;left:26px;top:23px;color:var(--muted);font-size:14px}
  .tabs{display:flex;gap:8px;padding:10px 14px 2px}
  .tab{
    flex:1;min-height:42px;border:1px solid var(--line);background:var(--card);color:var(--muted);
    border-radius:12px;font-weight:600;font-size:13.5px;cursor:pointer;
  }
  .tab.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

  /* ---------- Customer rows ---------- */
  .cust-list{padding:8px 14px}
  .cust-row{
    display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:11px 12px;margin-bottom:9px;cursor:pointer;box-shadow:var(--shadow);
  }
  .avatar{
    width:42px;height:42px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:15px;color:#fff;background:var(--accent);
  }
  .cinfo{flex:1;min-width:0}
  .cname{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cphone{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:1px}
  .overdue-chip{
    font-size:10.5px;background:var(--credit-bg);color:var(--credit);border-radius:99px;padding:1px 7px;font-weight:700;
  }
  .cbal{text-align:right;flex:none}
  .cbal .amt{font-weight:800;font-size:16px;color:var(--credit)}
  .cbal .amt.zero{color:var(--pay)}
  .cbal .sub{font-size:10.5px;color:var(--muted)}
  .wabtn{
    flex:none;width:42px;height:42px;border-radius:12px;background:rgba(31,170,83,.13);color:var(--wa);
    display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:19px;border:1px solid rgba(31,170,83,.25);
  }
  .wabtn:active{transform:scale(.93)}
  .empty{ text-align:center;color:var(--muted);padding:34px 20px;font-size:14px}
  .empty .big{font-size:38px;margin-bottom:8px}

  /* ---------- Bottom bar ---------- */
  .bottombar{
    position:fixed;bottom:0;left:0;right:0;z-index:25;
    display:flex;justify-content:center;pointer-events:none;
  }
  .bottombar .inner{
    pointer-events:auto;width:100%;max-width:420px;display:flex;gap:9px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    background:linear-gradient(to top,var(--bg) 65%,transparent);
  }
  .btn{
    flex:1;min-height:48px;border:none;border-radius:14px;font-weight:700;font-size:14.5px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;padding:0 14px;
  }
  .btn:active{transform:scale(.97)}
  .btn.primary{background:var(--accent);color:var(--accent-ink)}
  .btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--ink)}
  .btn.danger{background:var(--danger);color:#fff}
  .btn.wa{background:var(--wa);color:#fff}
  .btn.small{min-height:40px;font-size:13px;flex:none;padding:0 12px}

  /* ---------- Toolbar (import/csv) ---------- */
  .toolbar{display:flex;gap:8px;padding:8px 14px 0}
  .toolbtn{
    flex:1;min-height:42px;background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--ink);
    font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;
  }
  .toolbtn:active{transform:scale(.97)}

  /* ---------- Customer detail ---------- */
  .detail-head{
    margin:12px 14px 6px;background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:14px 16px;box-shadow:var(--shadow);
  }
  .detail-head .dh-top{display:flex;align-items:center;gap:12px}
  .detail-head .dh-bal{display:flex;align-items:baseline;gap:8px;margin-top:10px}
  .detail-head .dh-bal .n{font-size:28px;font-weight:800;color:var(--credit)}
  .detail-head .dh-bal .n.zero{color:var(--pay)}
  .detail-head .dh-bal .lbl{font-size:12.5px;color:var(--muted)}
  .backrow{padding:10px 14px 0}
  .backbtn{
    min-height:42px;background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--ink);
    padding:0 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
  }
  .entry{
    background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin:0 14px 9px;box-shadow:var(--shadow);
  }
  .entry .erow{display:flex;align-items:flex-start;gap:10px}
  .etype{
    flex:none;font-size:11px;font-weight:800;border-radius:8px;padding:4px 8px;letter-spacing:.4px;text-transform:uppercase;
  }
  .etype.credit{background:var(--credit-bg);color:var(--credit)}
  .etype.payment{background:var(--pay-bg);color:var(--pay)}
  .einfo{flex:1;min-width:0}
  .enote{font-weight:600;font-size:14px;word-break:break-word}
  .edate{font-size:12px;color:var(--muted);margin-top:2px}
  .eamt{flex:none;text-align:right}
  .eamt .v{font-weight:800;font-size:15.5px}
  .entry.credit .eamt .v{color:var(--credit)}
  .entry.payment .eamt .v{color:var(--pay)}
  .eactions{display:flex;gap:6px;margin-top:2px}
  .eact{
    min-width:36px;min-height:36px;border:1px solid var(--line);background:transparent;color:var(--muted);
    border-radius:9px;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;justify-content:center;
  }
  .shotimg{
    margin-top:9px;width:74px;height:74px;object-fit:cover;border-radius:10px;border:1px solid var(--line);
    cursor:pointer;display:block;background:var(--bg);
  }
  .ocr-chip{
    margin-top:8px;font-size:11.5px;background:var(--pay-bg);color:var(--pay);border-radius:9px;
    padding:4px 8px;display:inline-block;font-weight:600;
  }
  .sectiontitle{padding:10px 18px 4px;font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.4px;text-transform:uppercase}
  .upirow{margin:8px 14px 0;display:flex;gap:9px}
  .upirow .btn{flex:1}

  /* ---------- Sheets / modals ---------- */
  .sheetback{
    position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center;
  }
  .sheet{
    width:100%;max-width:420px;background:var(--bg);border-radius:20px 20px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));
    max-height:92vh;overflow-y:auto;
  }
  .sheet h2{margin:0 0 12px;font-size:17px}
  .seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;margin-bottom:12px}
  .seg button{
    flex:1;min-height:40px;border:none;border-radius:9px;background:transparent;color:var(--muted);
    font-weight:700;font-size:13.5px;cursor:pointer;
  }
  .seg button.on.credit{background:var(--credit-bg);color:var(--credit)}
  .seg button.on.payment{background:var(--pay-bg);color:var(--pay)}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:5px}
  .field input,.field textarea,.field select{
    width:100%;min-height:46px;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:10px 12px;outline:none;
  }
  .field textarea{min-height:110px;font-family:ui-monospace,Consolas,monospace;font-size:12px;resize:vertical}
  .field .err{color:var(--danger);font-size:12px;margin-top:4px;font-weight:600}
  .shotbox{
    border:1.5px dashed var(--line);border-radius:14px;padding:12px;text-align:center;background:var(--card);
  }
  .shotbox .hint{font-size:12px;color:var(--muted);margin-top:6px}
  .shotbox img.prev{max-width:100%;max-height:150px;border-radius:10px;margin-top:8px}
  .ocrstatus{font-size:12.5px;color:var(--gold);font-weight:700;margin-top:8px;min-height:16px}
  .filelabel{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;
    background:var(--accent);color:var(--accent-ink);border-radius:12px;font-weight:700;font-size:14px;cursor:pointer;
  }
  .filelabel input{position:absolute;width:1px;height:1px;opacity:0}
  .modal-center{align-items:center;padding:18px}
  .modal-center .sheet{border-radius:20px;max-height:88vh}
  .viewerimg{max-width:100%;max-height:70vh;border-radius:12px;display:block;margin:0 auto}
  .sheetrow{display:flex;gap:9px;margin-top:14px}

  /* ---------- Toast ---------- */
  #toast{
    position:fixed;left:50%;bottom:104px;transform:translateX(-50%) translateY(20px);z-index:60;
    background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:600;
    opacity:0;pointer-events:none;transition:all .25s;max-width:88vw;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,.3);
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast.err{background:var(--danger);color:#fff}

  .remind-prev{
    background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--muted);
    word-break:break-word;white-space:pre-wrap;
  }
</style>
</head>
<body>
<div id="app">

  <!-- ============ HEADER ============ -->
  <header>
    <div class="hrow">
      <button class="iconbtn" id="btn-import" title="Import data" aria-label="Import">📥</button>
      <div class="spacer"></div>
      <select class="langsel" id="langsel" aria-label="Language">
        <option value="en">EN</option>
        <option value="hi">हिंदी</option>
        <option value="te">తెలుగు</option>
      </select>
      <button class="iconbtn" id="btn-theme" title="Theme" aria-label="Theme">🌙</button>
    </div>
    <div class="brand">
      <div class="logo">₹</div>
      <div>
        <h1>Hisaab</h1>
        <div class="shop">Bunty Kirana Store</div>
      </div>
    </div>
    <div class="today-chip"><span>📅</span><span id="today-label"></span></div>
  </header>

  <!-- ============ TOTAL OUTSTANDING ============ -->
  <div class="total-card">
    <div class="ticon">🧾</div>
    <div>
      <div class="tlabel" data-i18n="total_outstanding">Total Outstanding</div>
      <div class="tval" id="total-outstanding">Rs 0</div>
    </div>
  </div>

  <!-- ============ HOME VIEW ============ -->
  <div id="view-home">
    <div class="searchwrap">
      <span class="sicon">🔍</span>
      <input id="search" type="search" data-i18n-ph="search_ph" placeholder="Search name or phone...">
    </div>
    <div class="tabs">
      <button class="tab active" id="tab-all" data-i18n="tab_all">All Customers</button>
      <button class="tab" id="tab-overdue" data-i18n="tab_overdue">Overdue</button>
    </div>
    <div class="toolbar">
      <button class="toolbtn" id="btn-csv">⬇️ <span data-i18n="csv_export">CSV Export</span></button>
      <button class="toolbtn" id="btn-addcust">👤 <span data-i18n="add_customer">Add Customer</span></button>
    </div>
    <div class="sectiontitle" id="list-title" data-i18n="customers">Customers</div>
    <div class="cust-list" id="customer-list"></div>
  </div>

  <!-- ============ CUSTOMER DETAIL VIEW ============ -->
  <div id="view-customer" class="hidden">
    <div class="backrow">
      <button class="backbtn" id="btn-back">← <span data-i18n="all_customers">All customers</span></button>
    </div>
    <div class="detail-head">
      <div class="dh-top">
        <div class="avatar" id="d-avatar">R</div>
        <div class="cinfo">
          <div class="cname" id="d-name">—</div>
          <div class="cphone" id="d-phone">—</div>
        </div>
      </div>
      <div class="dh-bal"><span class="n" id="d-balance">Rs 0</span><span class="lbl" data-i18n="balance">balance</span></div>
    </div>
    <div class="upirow">
      <a id="d-wa" class="btn wa" style="text-decoration:none" href="#" data-remind-target>💬 <span data-i18n="send_reminder">WhatsApp Reminder</span></a>
      <a id="d-upi" class="btn ghost" style="text-decoration:none" href="#">📲 <span data-i18n="upi_pay">Collect via UPI</span></a>
    </div>
    <div class="sectiontitle" data-i18n="ledger">Ledger — newest first</div>
    <div id="entry-list"></div>
    <div class="bottombar"><div class="inner">
      <button class="btn primary" id="btn-addentry">＋ <span data-i18n="add_entry">Add Entry</span></button>
    </div></div>
  </div>

  <!-- home bottom bar -->
  <div class="bottombar" id="home-bottombar"><div class="inner">
    <button class="btn primary" id="btn-addcust-fab">＋ <span data-i18n="new_customer">New Customer</span></button>
  </div></div>
</div>

<!-- ============ IMPORT SHEET ============ -->
<div class="sheetback hidden" id="sheet-import">
  <div class="sheet">
    <h2 data-i18n="import_title">Import shop data (JSON)</h2>
    <div class="field">
      <label data-i18n="import_hint">Paste the shop JSON below, then press Load. This replaces current data.</label>
      <textarea id="import-box" placeholder='{"shop":"...","customers":[...],"entries":[...]}'></textarea>
    </div>
    <div class="field"><div class="err hidden" id="import-err"></div></div>
    <div class="sheetrow">
      <button class="btn ghost" id="import-cancel" data-i18n="cancel">Cancel</button>
      <button class="btn primary" id="import-go" data-i18n="load_shop">Load Shop</button>
    </div>
  </div>
</div>

<!-- ============ CUSTOMER SHEET ============ -->
<div class="sheetback hidden" id="sheet-customer">
  <div class="sheet">
    <h2 id="cust-sheet-title" data-i18n="new_customer">New Customer</h2>
    <div class="field">
      <label data-i18n="f_name">Customer name</label>
      <input id="cust-name" type="text" autocomplete="off" placeholder="e.g. Ravi Kumar">
      <div class="err hidden" id="cust-name-err"></div>
    </div>
    <div class="field">
      <label data-i18n="f_phone">10-digit phone number</label>
      <input id="cust-phone" type="tel" inputmode="numeric" maxlength="10" autocomplete="off" placeholder="10 digit mobile number">
      <div class="err hidden" id="cust-phone-err"></div>
    </div>
    <div class="sheetrow">
      <button class="btn ghost" id="cust-cancel" data-i18n="cancel">Cancel</button>
      <button class="btn primary" id="cust-save" data-i18n="save_customer">Save Customer</button>
    </div>
  </div>
</div>

<!-- ============ ENTRY SHEET ============ -->
<div class="sheetback hidden" id="sheet-entry">
  <div class="sheet">
    <h2 id="entry-sheet-title" data-i18n="add_entry">Add Entry</h2>
    <div class="seg" id="type-seg">
      <button id="seg-credit" data-i18n="credit">Credit (gave goods)</button>
      <button id="seg-payment" data-i18n="payment">Payment (received)</button>
    </div>
    <div class="field">
      <label data-i18n="f_amount">Amount (₹)</label>
      <input id="entry-amount" type="number" inputmode="decimal" min="0" step="1" placeholder="0">
      <div class="err hidden" id="entry-amount-err"></div>
    </div>
    <div class="field">
      <label data-i18n="f_date">Date</label>
      <input id="entry-date" type="date">
      <div class="err hidden" id="entry-date-err"></div>
    </div>
    <div class="field">
      <label data-i18n="f_note">Note (optional)</label>
      <input id="entry-note" type="text" autocomplete="off" placeholder="e.g. groceries / paid on UPI">
    </div>
    <div class="field" id="shot-field">
      <label data-i18n="f_shot">Payment screenshot (optional)</label>
      <div class="shotbox">
        <label class="filelabel">📷 <span data-i18n="choose_image">Choose image</span>
          <input id="shot-input" type="file" accept="image/*">
        </label>
        <div class="hint" data-i18n="shot_hint">The amount is read automatically from the ₹ figure in the screenshot.</div>
        <div class="ocrstatus" id="ocr-status"></div>
        <img class="prev hidden" id="shot-preview" alt="screenshot preview">
      </div>
    </div>
    <div class="sheetrow">
      <button class="btn ghost" id="entry-cancel" data-i18n="cancel">Cancel</button>
      <button class="btn primary" id="entry-save" data-i18n="save_entry">Save Entry</button>
    </div>
  </div>
</div>

<!-- ============ DELETE CONFIRM ============ -->
<div class="sheetback hidden modal-center" id="sheet-confirm">
  <div class="sheet">
    <h2 data-i18n="delete_entry">Delete entry?</h2>
    <div class="remind-prev" id="confirm-text"></div>
    <div class="sheetrow">
      <button class="btn ghost" id="confirm-no" data-i18n="cancel">Cancel</button>
      <button class="btn danger" id="confirm-yes" data-i18n="delete">Delete</button>
    </div>
  </div>
</div>

<!-- ============ IMAGE VIEWER ============ -->
<div class="sheetback hidden modal-center" id="sheet-viewer">
  <div class="sheet">
    <img class="viewerimg" id="viewer-img" alt="payment screenshot">
    <div class="sheetrow"><button class="btn ghost" id="viewer-close" data-i18n="close">Close</button></div>
  </div>
</div>

<div id="toast"></div>

<script>
"use strict";
/* =====================================================================
   HISAAB — digital khata for Bunty Kirana Store
   Single-file app. localStorage persistence. No AI, no backend.
   ===================================================================== */

const SHOP_FALLBACK = "Bunty Kirana Store";
const UPI_VPA = "karkakarthik@ybl";
const UPI_PAYEE = "Bunty Kirana Store";
const UPI_SHORT = "https://upi.pe/karkakarthik@ybl";
const LS_DATA = "hisaab:data:v1";
const LS_PREFS = "hisaab:prefs:v1";

/* ---------------- i18n ---------------- */

/* ---------------- Reference date (?today=YYYY-MM-DD) ---------------- */
const urlToday = new URLSearchParams(location.search).get("today");
const REF_TODAY = (() => {
  if (urlToday && /^\d{4}-\d{2}-\d{2}$/.test(urlToday)) return urlToday;
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
})();

/* ---------------- Utilities ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const digits = s => String(s ?? "").replace(/\D/g, "");
function t(key){ return (I18N[prefs.lang] && I18N[prefs.lang][key]) || I18N.en[key] || key; }
function fmtRs(n){
  const sign = n < 0 ? "-" : "";
  return sign + "Rs " + Math.abs(Math.round(n)).toLocaleString("en-IN");
}
function daysBetween(d1, d2){ // d2 - d1 in whole days (date strings YYYY-MM-DD)
  return Math.round((new Date(d2 + "T00:00:00") - new Date(d1 + "T00:00:00")) / 86400000);
}
function fmtDate(iso){
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString("en-IN", { day:"numeric", month:"short", year:"numeric" });
}
function toast(msg, isErr){
  const el = $("#toast");
  el.textContent = msg;
  el.classList.toggle("err", !!isErr);
  el.classList.add("show");
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove("show"), 2600);
}
function initials(name){
  return String(name || "?").trim().split(/\s+/).map(w => w[0]).slice(0,2).join("").toUpperCase();
}

/* ---------------- Storage ---------------- */
function save(){
  try{
    localStorage.setItem(LS_DATA, JSON.stringify(state));
  }catch(e){
    // Quota exceeded — drop screenshots from oldest entries and retry once.
    try{
      const stripped = state.entries.filter(en => en.shot).slice(0, -1);
      stripped.forEach(en => delete en.shot);
      localStorage.setItem(LS_DATA, JSON.stringify(state));
      toast("Storage full: an old screenshot was dropped", true);
    }catch(e2){ toast("Could not save data", true); }
  }
}
function savePrefs(){ localStorage.setItem(LS_PREFS, JSON.stringify(prefs)); }
function loadPrefs(){
  try{ Object.assign(prefs, JSON.parse(localStorage.getItem(LS_PREFS) || "{}")); }catch(e){}
}
function load(){
  try{
    const raw = localStorage.getItem(LS_DATA);
    if(raw){
      const d = JSON.parse(raw);
      if(d && Array.isArray(d.customers) && Array.isArray(d.entries)){ state = d; return true; }
    }
  }catch(e){}
  return false;
}

/* ---------------- Derived data ---------------- */
function balanceOf(phone){
  return state.entries
    .filter(e => e.phone === phone)
    .reduce((s, e) => s + (e.type === "credit" ? +e.amount : -+e.amount), 0);
}
function totalOutstanding(){
  return state.customers.reduce((s, c) => s + Math.max(0, balanceOf(c.phone)), 0);
}
function lastPaymentDate(phone){
  const pays = state.entries.filter(e => e.phone === phone && e.type === "payment");
  if(!pays.length) return null;
  return pays.map(e => e.date).sort().pop();
}
function oldestCreditDate(phone){
  const creds = state.entries.filter(e => e.phone === phone && e.type === "credit");
  if(!creds.length) return null;
  return creds.map(e => e.date).sort()[0];
}
function overdueDays(phone){ // days since last payment (or since oldest unpaid credit if never paid)
  const lp = lastPaymentDate(phone);
  const base = lp || oldestCreditDate(phone);
  if(!base) return null;
  return Math.max(0, daysBetween(base, REF_TODAY));
}
function customerByPhone(phone){ return state.customers.find(c => c.phone === phone); }

/* ---------------- Import ---------------- */
function importData(obj, silent){
  if(!obj || typeof obj !== "object") throw new Error("Not a JSON object");
  const shop = typeof obj.shop === "string" && obj.shop.trim() ? obj.shop.trim() : SHOP_FALLBACK;
  const customersIn = obj.customers, entriesIn = obj.entries;
  if(!Array.isArray(customersIn)) throw new Error("Missing 'customers' array");
  if(!Array.isArray(entriesIn)) throw new Error("Missing 'entries' array");
  const customers = customersIn.map(c => {
    const phone = digits(c.phone);
    if(!/^\d{10}$/.test(phone)) throw new Error("Customer '" + (c.name||"") + "' needs a 10-digit phone");
    if(!c.name || !String(c.name).trim()) throw new Error("Customer with phone " + phone + " has no name");
    return { name: String(c.name).trim(), phone };
  });
  const phones = new Set(customers.map(c => c.phone));
  if(phones.size !== customers.length) throw new Error("Duplicate phone numbers in customers");
  const entries = entriesIn.map((e, i) => {
    const phone = digits(e.phone);
    if(!phones.has(phone)) throw new Error("Entry #" + i + " references unknown phone " + phone);
    const type = String(e.type || "").toLowerCase();
    if(type !== "credit" && type !== "payment") throw new Error("Entry #" + i + " type must be credit|payment");
    const amount = Math.round(+e.amount);
    if(!isFinite(amount) || amount < 0) throw new Error("Entry #" + i + " has invalid amount");
    const date = String(e.date || "");
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date)) throw new Error("Entry #" + i + " date must be YYYY-MM-DD");
    return { id: "imp" + i + "_" + Math.random().toString(36).slice(2,8), phone, type, amount,
             date, note: String(e.note || "").slice(0,200) };
  });
  state = { shop, customers, entries };
  save();
  if(!silent){ closeSheets(); renderAll(); toast("Imported " + customers.length + " customers, " + entries.length + " entries ✓"); }
}

/* ---------------- Rendering ---------------- */
function applyI18n(){
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-ph]").forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
  document.documentElement.lang = prefs.lang;
}
function renderAll(){
  applyI18n();
  $("#today-label").textContent = t("today_str") + ": " + fmtDate(REF_TODAY);
  $("#total-outstanding").textContent = fmtRs(totalOutstanding());
  renderHome();
  if(currentPhone) renderDetail(currentPhone);
}
function renderHome(){
  const q = $("#search").value.trim().toLowerCase();
  const overdueMode = prefs.tab === "overdue";
  $("#tab-all").classList.toggle("active", !overdueMode);
  $("#tab-overdue").classList.toggle("active", overdueMode);
  $("#list-title").textContent = overdueMode ? t("tab_overdue") : t("customers");

  let list = state.customers.map(c => {
    const bal = balanceOf(c.phone);
    return { ...c, bal, od: overdueDays(c.phone) };
  });

  if(overdueMode) list = list.filter(c => c.bal > 0).sort((a,b) => (b.od ?? -1) - (a.od ?? -1));
  if(q) list = list.filter(c => c.name.toLowerCase().includes(q) || c.phone.includes(digits(q) || q));

  const wrap = $("#customer-list");
  if(!list.length){
    wrap.innerHTML = `<div class="empty"><div class="big">📖</div>${
      q ? "No customer matches your search." :
      overdueMode ? "No overdue customers. Sab khush! 🎉" :
      "No customers yet.<br>Tap <b>New Customer</b> to start your khata."}</div>`;
    return;
  }
  wrap.innerHTML = list.map(c => {
    const sub = overdueMode
      ? (c.od === null ? "" : `<span class="overdue-chip">${c.od} ${t("overdue_days")}</span>`)
      : "";
    return `<div class="cust-row" data-customer="${esc(c.phone)}" data-balance="${c.bal}" data-name="${esc(c.name)}">
      <div class="avatar">${esc(initials(c.name))}</div>
      <div class="cinfo">
        <div class="cname">${esc(c.name)}</div>
        <div class="cphone">📞 ${esc(c.phone)} ${sub}</div>
      </div>
      <div class="cbal">
        <div class="amt ${c.bal <= 0 ? "zero" : ""}" data-balance>${esc(fmtRs(c.bal))}</div>
        <div class="sub">${c.bal > 0 ? t("balance") : "✓ settled"}</div>
      </div>
      <a class="wabtn" data-remind="${esc(c.phone)}" href="${esc(remindHref(c))}" aria-label="WhatsApp reminder for ${esc(c.name)}" title="Send WhatsApp reminder">💬</a>
    </div>`;
  }).join("");

  wrap.querySelectorAll(".cust-row").forEach(row => {
    row.addEventListener("click", ev => {
      if(ev.target.closest("a[data-remind]")) return; // let the reminder link work
      openDetail(row.dataset.customer);
    });
  });
}
function remindMessage(c){
  const amt = Math.max(0, balanceOf(c.phone));
  const shop = state.shop || SHOP_FALLBACK;
  return t("remind_msg")
    .replace(/\{name\}/g, c.name)
    .replace(/\{shop\}/g, shop)
    .replace(/\{amt\}/g, String(Math.round(amt)))
    .replace(/\{upideep\}/g, upiDeepLink(amt))
    .replace(/\{upi\}/g, UPI_SHORT);
}
function upiDeepLink(amt){
  return `upi://pay?pa=${UPI_VPA}&pn=${encodeURIComponent(UPI_PAYEE)}&am=${Math.round(amt)}&cu=INR`;
}
function remindHref(c){
  const amt = Math.max(0, balanceOf(c.phone));
  return `https://wa.me/91${c.phone}?text=${encodeURIComponent(remindMessage(c))}`;
}

/* ---------------- Customer detail ---------------- */
function openDetail(phone){
  currentPhone = phone;
  $("#view-home").classList.add("hidden");
  $("#home-bottombar").classList.add("hidden");
  $("#view-customer").classList.remove("hidden");
  window.scrollTo(0,0);
  renderDetail(phone);
}
function goHome(){
  currentPhone = null;
  $("#view-customer").classList.add("hidden");
  $("#view-home").classList.remove("hidden");
  $("#home-bottombar").classList.remove("hidden");
  renderAll();
}
function renderDetail(phone){
  const c = customerByPhone(phone);
  if(!c){ goHome(); return; }
  const bal = balanceOf(phone);
  $("#d-avatar").textContent = initials(c.name);
  $("#d-name").textContent = c.name;
  $("#d-phone").textContent = "📞 " + c.phone;
  const balEl = $("#d-balance");
  balEl.textContent = fmtRs(bal);
  balEl.classList.toggle("zero", bal <= 0);

  const wa = $("#d-wa");
  wa.href = remindHref(c);
  wa.setAttribute("data-remind", c.phone);

  const upi = $("#d-upi");
  upi.href = bal > 0 ? upiDeepLink(bal) : upiDeepLink(0);

  const entries = state.entries
    .filter(e => e.phone === phone)
    .sort((a,b) => b.date.localeCompare(a.date) || String(b.id||"").localeCompare(String(a.id||"")));

  const lp = lastPaymentDate(phone);
  const subline = lp ? `${t("last_paid")} ${fmtDate(lp)} (${daysBetween(lp, REF_TODAY)} ${t("days_ago")})` : t("paid_yet");

  const wrap = $("#entry-list");
  if(!entries.length){
    wrap.innerHTML = `<div class="empty"><div class="big">🧾</div>No entries yet.<br>Tap <b>Add Entry</b> to record credit or payment.</div>`;
  } else {
    wrap.innerHTML = `<div style="text-align:center;font-size:12px;color:var(--muted);padding:2px 0 8px">${subline}</div>` +
    entries.map(e => `
      <div class="entry ${esc(e.type)}" data-entry="${esc(e.id)}">
        <div class="erow">
          <span class="etype ${esc(e.type)}">${e.type === "credit" ? (prefs.lang==="hi"?"उधार":prefs.lang==="te"?"అప్పు":"CREDIT") : (prefs.lang==="hi"?"भुगतान":prefs.lang==="te"?"చెల్లింపు":"PAYMENT")}</span>
          <div class="einfo">
            <div class="enote">${esc(e.note) || (e.type==="credit" ? "groceries" : "payment")}</div>
            <div class="edate">${fmtDate(e.date)}</div>
            ${e.shot ? `<img class="shotimg" data-shot src="${e.shot}" alt="payment screenshot" data-entryid="${esc(e.id)}">` : ""}
            ${e.shotAmount ? `<div class="ocr-chip">🤖 Rs ${esc(e.shotAmount)} — ${prefs.lang==="hi"?"स्क्रीनशॉट से पढ़ा गया":prefs.lang==="te"?"స్క్రీన్‌షాట్ నుండి చదవబడింది":"read from screenshot"}</div>` : ""}
          </div>
          <div class="eamt">
            <div class="v">${e.type === "credit" ? "+" : "−"}${esc(fmtRs(e.amount).replace(/^Rs /,"₹"))}</div>
            <div class="eactions">
              <button class="eact" data-edit="${esc(e.id)}" aria-label="Edit entry">✏️</button>
              <button class="eact" data-del="${esc(e.id)}" aria-label="Delete entry">🗑️</button>
            </div>
          </div>
        </div>
      </div>`).join("");
  }

  wrap.querySelectorAll(".shotimg").forEach(img =>
    img.addEventListener("click", () => { $("#viewer-img").src = img.src; $("#sheet-viewer").classList.remove("hidden"); }));
  wrap.querySelectorAll("[data-edit]").forEach(b =>
    b.addEventListener("click", () => openEntrySheet(phone, b.dataset.edit)));
  wrap.querySelectorAll("[data-del]").forEach(b =>
    b.addEventListener("click", () => askDelete(b.dataset.del)));
}

/* ---------------- Sheets ---------------- */
function closeSheets(){
  ["#sheet-import","#sheet-customer","#sheet-entry","#sheet-confirm","#sheet-viewer"].forEach(s => $(s).classList.add("hidden"));
  $("#viewer-img").src = "";
}
function openCustomerSheet(){
  $("#cust-name").value = "";
  $("#cust-phone").value = "";
  $("#cust-name-err").classList.add("hidden");
  $("#cust-phone-err").classList.add("hidden");
  $("#sheet-customer").classList.remove("hidden");
  setTimeout(() => $("#cust-name").focus(), 60);
}
function saveCustomer(){
  const name = $("#cust-name").value.trim();
  const phone = digits($("#cust-phone").value);
  let ok = true;
  const nameErr = $("#cust-name-err"), phoneErr = $("#cust-phone-err");
  nameErr.classList.add("hidden"); phoneErr.classList.add("hidden");
  if(!name){ nameErr.textContent = "Please enter the customer's name."; nameErr.classList.remove("hidden"); ok = false; }
  if(!/^\d{10}$/.test(phone)){
    phoneErr.textContent = phone.length ? "Phone number must be exactly 10 digits." : "Please enter a 10-digit phone number.";
    phoneErr.classList.remove("hidden"); ok = false;
  } else if(customerByPhone(phone)){
    phoneErr.textContent = "Phone already registered to " + customerByPhone(phone).name + ".";
    phoneErr.classList.remove("hidden"); ok = false;
  }
  if(!ok) return;
  state.customers.push({ name, phone });
  save();
  $("#sheet-customer").classList.add("hidden");
  renderAll();
  toast("Customer saved ✓");
}

/* ---------------- Entry sheet ---------------- */
function openEntrySheet(phone, editId){
  entryEditingId = editId || null;
  entryType = "credit";
  pendingShot = null; pendingShotOrig = null;
  $("#entry-amount").value = "";
  $("#entry-note").value = "";
  $("#entry-amount-err").classList.add("hidden");
  $("#entry-date-err").classList.add("hidden");
  $("#shot-preview").classList.add("hidden");
  $("#ocr-status").textContent = "";
  $("#shot-field").style.display = "none";

  if(editId){
    const e = state.entries.find(x => x.id === editId);
    if(!e) return;
    entryType = e.type;
    $("#entry-amount").value = e.amount;
    $("#entry-note").value = e.note || "";
    $("#entry-date").value = e.date;
    if(e.shot){ pendingShot = e.shot; pendingShotOrig = e.shotOrig || e.shot; showPreview(pendingShot); }
    $("#shot-field").style.display = e.type === "payment" ? "" : "none";
    $("#entry-sheet-title").textContent = prefs.lang === "hi" ? "एंट्री बदलें" : prefs.lang === "te" ? "ఎంట్రీ మార్చు" : "Edit Entry";
  } else {
    $("#entry-date").value = REF_TODAY;
    $("#entry-sheet-title").textContent = t("add_entry");
  }
  setSegType(entryType);
  $("#sheet-entry").classList.remove("hidden");
}
function setSegType(type){
  entryType = type;
  $("#seg-credit").classList.toggle("on", type === "credit");
  $("#seg-payment").classList.toggle("on", type === "payment");
  $("#seg-credit").classList.toggle("credit", type === "credit");
  $("#seg-payment").classList.toggle("payment", type === "payment");
  $("#shot-field").style.display = type === "payment" ? "" : "none";
}
function saveEntry(){
  const amount = Math.round(+$("#entry-amount").value);
  const date = $("#entry-date").value;
  const note = $("#entry-note").value.trim().slice(0,200);
  let ok = true;
  $("#entry-amount-err").classList.add("hidden");
  $("#entry-date-err").classList.add("hidden");
  if(!isFinite(amount) || amount <= 0){
    $("#entry-amount-err").textContent = "Enter a valid amount."; $("#entry-amount-err").classList.remove("hidden"); ok = false;
  }
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){
    $("#entry-date-err").textContent = "Choose a date."; $("#entry-date-err").classList.remove("hidden"); ok = false;
  }
  if(!ok) return;

  if(entryEditingId){
    const e = state.entries.find(x => x.id === entryEditingId);
    Object.assign(e, { type: entryType, amount, date, note });
    if(entryType === "payment"){ if(pendingShot) e.shot = pendingShot; if(pendingShotOrig) e.shotOrig = pendingShotOrig; }
    else { delete e.shot; delete e.shotOrig; delete e.shotAmount; }
  } else {
    const e = { id: "e" + Date.now() + "_" + Math.random().toString(36).slice(2,7),
                phone: currentPhone, type: entryType, amount, date, note };
    if(entryType === "payment" && pendingShot){ e.shot = pendingShot; e.shotOrig = pendingShotOrig; }
    if(entryType === "payment" && window.__ocrAmount != null && window.__ocrAmount === amount) e.shotAmount = window.__ocrAmount;
    state.entries.push(e);
  }
  save();
  closeSheets();
  window.__ocrAmount = null;
  renderAll();
  toast(entryEditingId ? "Entry updated ✓" : (entryType === "credit" ? "Credit saved" : "Payment saved") + " ✓");
}
function askDelete(id){
  deleteTargetId = id;
  const e = state.entries.find(x => x.id === id);
  $("#confirm-text").textContent = e
    ? `${e.type === "credit" ? "Credit" : "Payment"} ${fmtRs(e.amount)} — ${e.note || "no note"} (${fmtDate(e.date)})`
    : "";
  $("#sheet-confirm").classList.remove("hidden");
}
function doDelete(){
  state.entries = state.entries.filter(e => e.id !== deleteTargetId);
  save(); closeSheets(); renderAll(); toast("Entry deleted, balances updated ✓");
}

/* ---------------- Image compression + OCR ---------------- */
function compressImage(file, maxDim){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = () => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        const cv = document.createElement("canvas");
        cv.width = w; cv.height = h;
        cv.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(cv.toDataURL("image/jpeg", 0.72));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
function showPreview(dataUrl){
  const p = $("#shot-preview");
  p.src = dataUrl; p.classList.remove("hidden");
}
function loadTesseract(){
  return new Promise((resolve, reject) => {
    if(window.Tesseract) return resolve();
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
    s.onload = () => resolve();
    s.onerror = () => reject(new Error("OCR library failed to load"));
    document.head.appendChild(s);
  });
}
function preprocessForOcr(dataUrl, scale, binarize){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onerror = reject;
    img.onload = () => {
      const cv = document.createElement("canvas");
      cv.width = Math.round(img.width * scale);
      cv.height = Math.round(img.height * scale);
      const ctx = cv.getContext("2d");
      ctx.imageSmoothingEnabled = scale < 1;
      ctx.drawImage(img, 0, 0, cv.width, cv.height);
      if(binarize){
        const d = ctx.getImageData(0, 0, cv.width, cv.height);
        const px = d.data;
        for(let i = 0; i < px.length; i += 4){
          const g = 0.299 * px[i] + 0.587 * px[i+1] + 0.114 * px[i+2];
          const v = g > 150 ? 255 : 0;
          px[i] = px[i+1] = px[i+2] = v;
        }
        ctx.putImageData(d, 0, 0);
      }
      resolve(cv.toDataURL("image/jpeg", 0.9));
    };
    img.src = dataUrl;
  });
}
async function ocrReadAmount(dataUrl){
  await loadTesseract();
  const worker = await Tesseract.createWorker("eng");
  try{
    // Tesseract's layout analysis is flaky on large display-font amounts, so try
    // several page-segmentation modes and preprocessed variants until one yields ₹.
    const variants = [
      { img: dataUrl, psm: "3" },
      { img: dataUrl, psm: "11" },
      { img: dataUrl, psm: "12" },
      { img: await preprocessForOcr(dataUrl, 2, true), psm: "3" },
      { img: await preprocessForOcr(dataUrl, 2, true), psm: "11" },
      { img: await preprocessForOcr(dataUrl, 1.6, false), psm: "6" }
    ];
    for(const v of variants){
      await worker.setParameters({ tessedit_pageseg_mode: v.psm });
      const { data } = await worker.recognize(v.img);
      const amt = extractAmount(data.text);
      if(amt != null) return amt;
    }
    return null;
  } finally { await worker.terminate(); }
}
function normAmt(s){
  const n = Math.round(parseFloat(String(s).replace(/[,\s]/g, "")));
  return isFinite(n) && n > 0 && n < 1e8 ? n : null;
}
function extractAmount(text){
  if(!text) return null;
  const clean = String(text).replace(/\u00a0/g, " ");
  // 1) Exact rupee markers: ₹ 250 | Rs. 250 | INR 250 | 250 ₹
  const patterns = [
    /₹\s*([0-9][0-9,\s]*(?:\.\d{1,2})?)/,
    /(?:Rs\.?|INR)\s*\.?\s*([0-9][0-9,\s]*(?:\.\d{1,2})?)/i,
    /([0-9][0-9,\s]*(?:\.\d{1,2})?)\s*(?:₹|Rs\.?|INR)/i
  ];
  for(const re of patterns){
    const m = clean.match(re);
    if(m){ const n = normAmt(m[1]); if(n) return n; }
  }
  // 2) OCR engines often misread the ₹ glyph as junk ("T 250", "¥250", "#250").
  //    Take the number that directly follows a short symbol-like token, or a
  //    symbol+number token jammed together ("T250").
  const tokens = clean.split(/\s+/).filter(Boolean);
  for(let i = 0; i < tokens.length; i++){
    const tk = tokens[i];
    // jammed: symbol prefix + digits, e.g. "T250", "¥250.00", "₹250/-"
    let m = tk.match(/^[₹$¥#€£Tt?]+([0-9][0-9,]*(?:\.\d{1,2})?)(?:[.,;:!?]|\/-)?$/);
    if(m){ const n = normAmt(m[1]); if(n) return n; }
    // separated: "₹ 250" read as two tokens
    const next = tokens[i+1];
    if(/^[₹$¥#€£Tt?]{1,2}$/.test(tk) && next){
      m = next.match(/^([0-9][0-9,]*(?:\.\d{1,2})?)(?:[.,;:!?]|\/-)?$/);
      if(m){ const n = normAmt(m[1]); if(n) return n; }
    }
  }
  // 3) Last resort: the largest plausible standalone amount (1–6 digit number;
  //    reference numbers are much longer and excluded by the length cap).
  let best = null;
  for(const tk of tokens){
    const m = tk.match(/^([0-9]{1,6})(?:\.\d{1,2})?(?:[.,;:!?]|\/-)?$/);
    if(m){ const n = normAmt(m[1]); if(n && (!best || n > best)) best = n; }
  }
  return best;
}
async function handleShotFile(file){
  if(!file) return;
  if(!/^image\//.test(file.type)){ toast("Please choose an image file", true); return; }
  const status = $("#ocr-status");
  try{
    const small = await compressImage(file, 900);   // stored copy
    const big   = await compressImage(file, 1600);  // higher-res copy for OCR
    pendingShot = small;
    pendingShotOrig = big;
    showPreview(small);
    status.textContent = "🔎 Reading amount from screenshot…";
    window.__ocrAmount = null;
    let text = "";
    try{ window.__ocrAmount = await ocrReadAmount(big); }
    catch(e){ status.textContent = "⚠️ Could not read image (offline?) — enter the amount manually."; return; }
    const amt = window.__ocrAmount;
    if(amt != null){
      $("#entry-amount").value = amt;
      status.textContent = `✓ Amount ₹${amt.toLocaleString("en-IN")} read from screenshot`;
    } else {
      status.textContent = "⚠️ No ₹ amount found — please enter it manually.";
    }
  }catch(e){
    status.textContent = "⚠️ Image could not be processed — enter the amount manually.";
  }
}

/* ---------------- CSV export ---------------- */
function exportCSV(){
  const q = s => `"${String(s ?? "").replace(/"/g, '""')}"`;
  const lines = [];
  lines.push([q("SECTION"), q("name"), q("phone"), q("balance_rs")].join(","));
  state.customers.forEach(c => lines.push([q("CUSTOMER"), q(c.name), q(c.phone), q(balanceOf(c.phone))].join(",")));
  lines.push("");
  lines.push([q("SECTION"), q("phone"), q("customer_name"), q("type"), q("amount_rs"), q("date"), q("note"), q("has_screenshot")].join(","));
  state.entries
    .slice()
    .sort((a,b) => a.date.localeCompare(b.date))
    .forEach(e => lines.push([q("ENTRY"), q(e.phone), q((customerByPhone(e.phone)||{}).name||""), q(e.type), q(e.amount), q(e.date), q(e.note), q(e.shot ? "yes" : "no")].join(",")));
  const blob = new Blob(["\ufeff" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "hisaab_ledger_" + REF_TODAY + ".csv";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast("CSV downloaded ✓");
}

/* ---------------- Theme ---------------- */
function applyTheme(){
  const dark = prefs.theme
    ? prefs.theme === "dark"
    : window.matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  $("#btn-theme").textContent = dark ? "☀️" : "🌙";
}
function toggleTheme(){
  const dark = document.documentElement.dataset.theme === "dark";
  prefs.theme = dark ? "light" : "dark";
  savePrefs(); applyTheme();
}

/* ---------------- Events ---------------- */
function bind(){
  $("#btn-theme").addEventListener("click", toggleTheme);
  $("#langsel").addEventListener("change", e => { prefs.lang = e.target.value; savePrefs(); renderAll(); });
  $("#search").addEventListener("input", renderHome);
  $("#tab-all").addEventListener("click", () => { prefs.tab = "all"; savePrefs(); renderHome(); });
  $("#tab-overdue").addEventListener("click", () => { prefs.tab = "overdue"; savePrefs(); renderHome(); });

  $("#btn-back").addEventListener("click", goHome);
  $("#btn-addcust").addEventListener("click", openCustomerSheet);
  $("#btn-addcust-fab").addEventListener("click", openCustomerSheet);
  $("#cust-cancel").addEventListener("click", closeSheets);
  $("#cust-save").addEventListener("click", saveCustomer);

  $("#btn-addentry").addEventListener("click", () => openEntrySheet(currentPhone, null));
  $("#seg-credit").addEventListener("click", () => setSegType("credit"));
  $("#seg-payment").addEventListener("click", () => setSegType("payment"));
  $("#entry-cancel").addEventListener("click", closeSheets);
  $("#entry-save").addEventListener("click", saveEntry);
  $("#shot-input").addEventListener("change", e => { handleShotFile(e.target.files[0]); e.target.value = ""; });

  $("#btn-import").addEventListener("click", () => { $("#import-box").value=""; $("#import-err").classList.add("hidden"); $("#sheet-import").classList.remove("hidden"); });
  $("#import-cancel").addEventListener("click", closeSheets);
  $("#import-go").addEventListener("click", () => {
    const errEl = $("#import-err");
    errEl.classList.add("hidden");
    try{ importData(JSON.parse($("#import-box").value)); }
    catch(e){
      errEl.textContent = "Import failed: " + e.message;
      errEl.classList.remove("hidden");
    }
  });

  $("#confirm-no").addEventListener("click", closeSheets);
  $("#confirm-yes").addEventListener("click", doDelete);
  $("#viewer-close").addEventListener("click", closeSheets);

  $("#btn-csv").addEventListener("click", exportCSV);

  ["#sheet-import","#sheet-customer","#sheet-entry","#sheet-confirm","#sheet-viewer"].forEach(sel => {
    $(sel).addEventListener("click", e => { if(e.target === $(sel)) closeSheets(); });
  });

  // detail reminder link should also refresh if balances changed
  $("#d-wa").addEventListener("click", () => { const c = customerByPhone(currentPhone); if(c) $("#d-wa").href = remindHref(c); });
}

/* ---------------- Boot ---------------- */
seedIfEmpty();
loadPrefs();
$("#langsel").value = prefs.lang;
applyTheme();
bind();
renderAll();
</script>
